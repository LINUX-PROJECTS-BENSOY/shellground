name: CI

on:
  push:
    branches: [main, release/*, feat/*, fix/*, chore/*]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit & content tests
        run: npm run test

      - name: Build web bundle
        run: npm run build

